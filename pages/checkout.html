<!DOCTYPE html>
<html lang="ру">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Electro — Оформление заказа</title>
		<link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700" rel="stylesheet">
		<link type="text/css" rel="stylesheet" href="../css/bootstrap.min.css"/>
		<link type="text/css" rel="stylesheet" href="../css/slick.css"/>
		<link type="text/css" rel="stylesheet" href="../css/slick-theme.css"/>
		<link type="text/css" rel="stylesheet" href="../css/nouislider.min.css"/>
		<link rel="stylesheet" href="../css/font-awesome.min.css">
		<link type="text/css" rel="stylesheet" href="../css/style.css"/>
		<link type="text/css" rel="stylesheet" href="../css/custom-ru.css"/>
	</head>
	<body>
		<header>
			<div id="top-header">
				<div class="container">
					<ul class="header-links pull-left">
						<li><a href="#"><i class="fa fa-phone"></i> +7 (999) 123-45-67</a></li>
						<li><a href="#"><i class="fa fa-envelope-o"></i> info@example.ru</a></li>
						<li><a href="#"><i class="fa fa-map-marker"></i> г. Москва, ул. Тверская, 1</a></li>
					</ul>
					<ul class="header-links pull-right">
						<li><a href="#"><i class="fa fa-rub"></i> RUB</a></li>
						<li><a href="auth.html" data-role="account"><i class="fa fa-user-o"></i> Мой аккаунт</a></li>
					</ul>
				</div>
			</div>
		</header>

		<nav id="navigation">
			<div class="container">
				<div id="responsive-nav">
					<ul class="main-nav nav navbar-nav">
						<li class="active"><a href="../index.html">Главная</a></li>
						<li><a href="store.html">Горячие предложения</a></li>
						<li><a href="store.html">Категории</a></li>
						<li><a href="store.html">Ноутбуки</a></li>
						<li><a href="store.html">Смартфоны</a></li>
						<li><a href="store.html">Камеры</a></li>
						<li><a href="store.html">Аксессуары</a></li>
					</ul>
				</div>
			</div>
		</nav>

		<div class="section">
			<div class="container">
				<div class="row">
					<div class="col-md-7">
						<div class="billing-details">
							<div class="section-title"><h3 class="title">Платёжный адрес</h3></div>
							<div class="form-group"><input class="input" id="bill-name" type="text" placeholder="Имя" required></div>
							<div class="form-group"><input class="input" id="bill-surname" type="text" placeholder="Фамилия" required></div>
							<div class="form-group"><input class="input" id="bill-email" type="email" placeholder="E-mail" required></div>
							<div class="form-group"><input class="input" id="bill-address" type="text" placeholder="Адрес" required></div>
							<div class="form-group"><input class="input" id="bill-city" type="text" placeholder="Город" required></div>
							<div class="form-group"><input class="input" id="bill-country" type="text" placeholder="Страна" required></div>
							<div class="form-group"><input class="input" id="bill-zip" type="text" placeholder="Почтовый индекс" required></div>
							<div class="form-group"><input class="input" id="bill-phone" type="tel" placeholder="Телефон" required pattern="[0-9+\-() ]{6,}"></div>
							<div class="form-group"><textarea class="input" id="bill-comment" placeholder="Комментарий к заказу"></textarea></div>
						</div>
					</div>
					<div class="col-md-5 order-details">
						<div class="section-title text-center"><h3 class="title">Ваш заказ</h3></div>
						<div class="order-summary">
							<div class="order-col"><div><strong>ТОВАР</strong></div><div><strong>ИТОГО</strong></div></div>
							<div id="order-products" class="order-products"></div>
							<div class="order-col"><div>Доставка</div><div><strong>БЕСПЛАТНО</strong></div></div>
							<div class="order-col"><div><strong>ИТОГО</strong></div><div><strong class="order-total" id="order-total">₽0.00</strong></div></div>
						</div>
						<a href="#" class="primary-btn order-submit" id="place-order">Оформить заказ</a>
					</div>
				</div>
			</div>
		</div>

		<script src="../js/jquery.min.js"></script>
		<script src="../js/bootstrap.min.js"></script>
		<script src="../js/auth.js"></script>
		<script src="../js/cart.js"></script>
		<script>
		(function(){
		  function format(amount){return '₽'+Number(amount).toFixed(2);}    
		  var list = document.getElementById('order-products');
		  var totalEl = document.getElementById('order-total');
		  var cart = JSON.parse(localStorage.getItem('electro_cart')||'[]');
		  var total = 0;
		  list.innerHTML = '';
		  cart.forEach(function(item){
		    var row = document.createElement('div');
		    row.className = 'order-col';
		    row.innerHTML = '<div>'+item.qty+'x '+item.name+'</div><div>'+format(item.price*item.qty)+'</div>';
		    list.appendChild(row);
		    total += item.price*item.qty;
		  });
		  totalEl.textContent = format(total);
		  document.getElementById('place-order').addEventListener('click', function(e){
		    e.preventDefault();
		    var requiredIds = ['bill-name','bill-surname','bill-email','bill-address','bill-city','bill-country','bill-zip','bill-phone'];
		    for (var i=0;i<requiredIds.length;i++){
		      var el = document.getElementById(requiredIds[i]);
		      if (!el || !el.checkValidity() || !el.value.trim()){ alert('Заполните все обязательные поля корректно'); return; }
		    }
		    alert('Заказ оформлен! Спасибо.');
		    localStorage.removeItem('electro_cart');
		    window.location.href = '../index.html';
		  });
		})();
		</script>
	</body>
</html>
