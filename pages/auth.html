<!DOCTYPE html>
<html lang="ru">
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>Electro — Регистрация</title>
		<link href="https://fonts.googleapis.com/css?family=Montserrat:400,500,700" rel="stylesheet">
		<link type="text/css" rel="stylesheet" href="../css/bootstrap.min.css"/>
		<link type="text/css" rel="stylesheet" href="../css/style.css"/>
		<link type="text/css" rel="stylesheet" href="../css/custom-ru.css"/>
		<link rel="stylesheet" href="../css/font-awesome.min.css">
	</head>
	<body>
		<div class="section">
			<div class="container">
				<div class="row">
					<div class="col-md-6 col-md-offset-3">
						<div class="section-title text-center">
							<h3 class="title">Регистрация</h3>
						</div>
						<form id="register-form">
							<div class="form-group">
								<input class="input" type="text" id="name" placeholder="Имя" required>
							</div>
							<div class="form-group">
								<input class="input" type="email" id="email" placeholder="E-mail" required>
							</div>
							<div class="form-group">
								<input class="input" type="password" id="password" placeholder="Пароль" required>
							</div>
							<button class="primary-btn" type="submit">Создать аккаунт</button>
						</form>
						<p style="margin-top:15px;">Уже есть аккаунт? <a href="../index.html">На главную</a></p>
					</div>
				</div>
			</div>
		</div>

		<script src="../js/jquery.min.js"></script>
		<script src="../js/bootstrap.min.js"></script>
		<script src="../js/auth.js"></script>
		<script>
		  document.getElementById('register-form').addEventListener('submit', function(e){
		    e.preventDefault();
		    var name = document.getElementById('name').value.trim();
		    var email = document.getElementById('email').value.trim();
		    var password = document.getElementById('password').value;
		    if (!name || !email || password.length < 4) {
		      alert('Пожалуйста, заполните все поля. Пароль не короче 4 символов.');
		      return;
		    }
		    window.ElectroAuth.register(name, email, password);
		    window.location.href = '../index.html';
		  });
		</script>
	</body>
</html>
